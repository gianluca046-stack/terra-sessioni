<input type="file" id="file" accept=".json,application/json,text/plain,application/octet-stream" hidden>

<script>

   Legge il file .json esportato da TERRA ("Per l'app di campagna..."), funziona senza internet,
   salva sul telefono quello che si scrive (altezza d'antenna, orari veri, note) ed esporta il
   registro della campagna in JSON e CSV. Misure in metri.

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function leggi(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function scrivi(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { toast("Non riesco a salvare sul telefono (memoria piena?)"); return false; } }
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("vis"); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("vis"), 2600); }
function ora() { const d = new Date(); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
function oggi() { const d = new Date(); return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear(); }
function metri(m) { return m >= 10000 ? (m / 1000).toFixed(1).replace(".", ",") + " km (" + Math.round(m).toLocaleString("it-IT") + " m)" : Math.round(m).toLocaleString("it-IT") + " m"; }

/* ---------------------------------------------------------------- GPS e bussola */
function avviaGps() {
  if (guarda != null || !navigator.geolocation) { if (!navigator.geolocation) bTesto("Questo telefono non da' la posizione all'app."); return; }
  guarda = navigator.geolocation.watchPosition((g) => { pos = g.coords; aggBussola(); aggSchemaPos(); },
    (err) => bTesto(err.code === 1 ? "Posizione non permessa: abilitala per questa app nelle impostazioni del telefono." : "GPS non disponibile (" + err.message + ")."),
    { enableHighAccuracy: true, maximumAge: 3000, timeout: 30000 });
  if (window.DeviceOrientationEvent && !avviaGps._b) {
    avviaGps._b = true;
    const on = (e) => { const h = e.webkitCompassHeading != null ? e.webkitCompassHeading : (e.absolute && e.alpha != null ? 360 - e.alpha : null); if (h != null) { rotta = h; aggBussola(); } };

}
function fermaGps() { if (guarda != null && navigator.geolocation) navigator.geolocation.clearWatch(guarda); guarda = null; }
function bTesto(t) { const el = $("#bus-t"); if (el) el.innerHTML = t; }
function distAz(la1, lo1, la2, lo2) {
  const R = 6371000, r = Math.PI / 180, f1 = la1 * r, f2 = la2 * r, df = (la2 - la1) * r, dl = (lo2 - lo1) * r;
  const a = Math.sin(df / 2) ** 2 + Math.cos(f1) * Math.cos(f2) * Math.sin(dl / 2) ** 2;
  const d = 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
  const az = (Math.atan2(Math.sin(dl) * Math.cos(f2), Math.cos(f1) * Math.sin(f2) - Math.sin(f1) * Math.cos(f2) * Math.cos(dl)) / r + 360) % 360;
  return [d, az];
}
function aggBussola() {
  const svg = $("#bus"); if (!svg || st.vista !== "dettaglio") return;
  const p = punto(st.punto); if (!p || p.lat == null) return;
  let h = `<circle r="50" fill="#fff" stroke="#D7DBD4" stroke-width="2"/>`;
  const giro = rotta != null ? -rotta : 0;
  h += `<g transform="rotate(${giro})"><text y="-37" text-anchor="middle" font-size="13" font-weight="700" fill="#D2382F">N</text></g>`;
  if (!pos) { svg.innerHTML = h + `<circle r="4" fill="#6B7780"/>`; return; }
  const [d, az] = distAz(pos.latitude, pos.longitude, p.lat, p.lon);
  h += `<g transform="rotate(${az + giro})"><path d="M0 -42 L9 -12 L3 -14 L3 30 L-3 30 L-3 -14 L-9 -12 Z" fill="${d < 15 ? "#2F6B4F" : "#E8892B"}"/></g><circle r="4" fill="#14271E"/>`;
  svg.innerHTML = h;
  bTesto(`<div class="ora" style="color:var(--testo)">${metri(d)}</div><div>direzione ${Math.round(az)}° dal Nord${rotta == null ? " (la freccia e' rispetto al Nord)" : ""}</div>
    <div>precisione GPS &plusmn; ${Math.round(pos.accuracy)} m</div>${d < 15 ? '<div style="color:var(--verde);font-weight:700">Sei sul vertice</div>' : ""}`);
}

/* ---------------------------------------------------------------- schema della rete */
let vb = null;
function piano() {
  const pp = P.punti || [], geo = pp.length && pp.every((p) => p.lat != null);
  let la0 = 0, lo0 = 0;
  if (geo) { la0 = pp.reduce((a, p) => a + p.lat, 0) / pp.length; lo0 = pp.reduce((a, p) => a + p.lon, 0) / pp.length; }
  const kx = 111320 * Math.cos(la0 * Math.PI / 180), ky = 110540;
  const xy = geo ? (la, lo) => [(lo - lo0) * kx, -(la - la0) * ky] : null;
  const pt = {};
  pp.forEach((p) => { pt[p.nome] = geo ? xy(p.lat, p.lon) : [p.e, -p.n]; });
  return { geo, xy, pt };
}
function vSchema(m) {
  const sessV = st.sess;
  m.innerHTML = `<div class="filtri" id="sf">${['<button data-s="" class="' + (!sessV ? "att" : "") + '">Tutte</button>']
    .concat(P.sessioni.map((s) => `<button data-s="${s.n}" class="${s.n === sessV ? "att" : ""}" style="${s.n === sessV ? "background:" + s.colore + ";border-color:" + s.colore : ""}">S${s.n}${s.nome ? " " + esc(s.nome) : ""}</button>`)).join("")}</div>
    <svg id="schema"></svg><div class="tenue" id="sch-t" style="margin-top:6px">Trascina per spostare, due dita o rotellina per lo zoom. Tocca un vertice per aprirlo.</div>`;
  document.querySelectorAll("#sf button").forEach((b) => b.addEventListener("click", () => { st.sess = b.dataset.s ? Number(b.dataset.s) : null; salvaStato(); disegna(); }));
  vb = null; schemaDisegna();
  if (piano().geo) avviaGps();
  const svg = $("#schema"), ptr = new Map(); let base = null;
  svg.addEventListener("pointerdown", (e) => { svg.setPointerCapture(e.pointerId); ptr.set(e.pointerId, [e.clientX, e.clientY]); base = { vb: vb.slice(), ptr: new Map(ptr), mosso: false }; });
  svg.addEventListener("pointermove", (e) => {
    if (!ptr.has(e.pointerId) || !base) return;
    ptr.set(e.pointerId, [e.clientX, e.clientY]);
    const r = svg.getBoundingClientRect(), k = base.vb[2] / r.width;
    const a = [...ptr.values()], b0 = [...base.ptr.values()];
    if (a.length === 1 && b0.length === 1) {
      const dx = a[0][0] - b0[0][0], dy = a[0][1] - b0[0][1];
      if (Math.abs(dx) + Math.abs(dy) > 4) base.mosso = true;
      vb = [base.vb[0] - dx * k, base.vb[1] - dy * k, base.vb[2], base.vb[3]];
    } else if (a.length >= 2 && b0.length >= 2) {
      base.mosso = true;
      const d1 = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]), d0 = Math.hypot(b0[0][0] - b0[1][0], b0[0][1] - b0[1][1]) || 1;
      const f = d0 / d1, cx = (b0[0][0] + b0[1][0]) / 2 - r.left, cy = (b0[0][1] + b0[1][1]) / 2 - r.top;
      const wx = base.vb[0] + cx * k, wy = base.vb[1] + cy * (base.vb[3] / r.height);
      vb = [wx - (wx - base.vb[0]) * f, wy - (wy - base.vb[1]) * f, base.vb[2] * f, base.vb[3] * f];
    }
    svg.setAttribute("viewBox", vb.join(" "));
  });
  const su = (e) => {
    if (base && !base.mosso && ptr.size === 1) {
      const t = e.target.closest && e.target.closest("[data-p]");
      if (t) { const p = t.dataset.p, s = P.sessioni.find((x) => (st.sess ? x.n === st.sess : true) && x.vertici.some((v) => v.punto === p)); if (s) vai("dettaglio", { sess: s.n, punto: p }); }
    }
    ptr.delete(e.pointerId); base = ptr.size ? { vb: vb.slice(), ptr: new Map(ptr), mosso: true } : null;
  };
  svg.addEventListener("pointerup", su); svg.addEventListener("pointercancel", su);
  svg.addEventListener("wheel", (e) => {
    e.preventDefault(); const r = svg.getBoundingClientRect(), f = e.deltaY > 0 ? 1.2 : 1 / 1.2;
    const wx = vb[0] + (e.clientX - r.left) / r.width * vb[2], wy = vb[1] + (e.clientY - r.top) / r.height * vb[3];
    vb = [wx - (wx - vb[0]) * f, wy - (wy - vb[1]) * f, vb[2] * f, vb[3] * f]; svg.setAttribute("viewBox", vb.join(" "));
  }, { passive: false });
}
function schemaDisegna() {

  }));

    h += `<g data-p="${esc(p.nome)}" opacity="${f}">` + (p.noto
      ? `<path d="M${c[0]} ${c[1] - 6 * u} L${c[0] + 5.2 * u} ${c[1] + 3 * u} L${c[0] - 5.2 * u} ${c[1] + 3 * u} Z" fill="#DCE9E1" stroke="#2F6B4F" stroke-width="${1.4 * u}"/>`
      : `<circle cx="${c[0]}" cy="${c[1]}" r="${3.8 * u}" fill="#E8892B" stroke="#26352E" stroke-width="${u}"/>`)

      + `<text x="${c[0] + 7 * u}" y="${c[1] - 6 * u}" font-size="${10 * u}" fill="${p.noto ? "#2F6B4F" : "#1D262B"}" font-weight="${p.noto ? 700 : 400}">${esc(p.nome)}</text></g>`;

/* ---------------------------------------------------------------- condivisione tra i telefoni (ntfy.sh)
   Ogni telefono manda a un canale comune (nome ricavato dal file delle sessioni) i vertici che registra, i
   controlli GDOP e le impostazioni; legge quelli degli altri ogni 15 secondi quando c'e' internet. Senza rete
   tutto resta in coda sul telefono e parte appena torna il segnale. Le foto non passano dal canale. */
const NTFY = leggi("terra_sess_ntfy", "") || "https://ntfy.sh/";   // (il primo serve solo per le prove)
const dormi = (ms) => new Promise((r) => setTimeout(r, ms));
function testata() {
  const el = $("#h-sub");
  if (!P) { el.textContent = "Sessioni GNSS in campagna"; return; }
  let t = P.sessioni.length + " sessioni" + (P.sistema ? " · " + P.sistema : "");
  if (IMP.condividi) t += inLinea === false || !navigator.onLine ? " · non in linea" + (OUT.length ? " (" + OUT.length + " da inviare)" : "") : inLinea ? " · in linea" : " · collegamento...";
  el.textContent = t;
}
function segnaLinea(v) { if (inLinea !== v) { inLinea = v; testata(); } }
function metti(topic, corpo, intest) { OUT.push({ t: topic, b: corpo, h: intest || null }); scrivi(K_OUT + st.prog, OUT); svuota(); }
function invia(msg) {
  if (!IMP.condividi || !CANALE) return;
  msg.v = 1; msg.d = DEV;
  metti(CANALE, JSON.stringify(msg));
}
async function svuota() {
  if (svuota.in || !OUT.length || !navigator.onLine || !IMP.condividi) return;
  svuota.in = true;
  const prog = st.prog;
  try {
    while (OUT.length && st.prog === prog) {
      const m = OUT[0];
      let r;
      try { r = await fetch(NTFY + m.t, { method: "POST", body: m.b, headers: m.h || {} }); } catch (e) { segnaLinea(false); break; }
      if (r.ok || (r.status >= 400 && r.status < 500 && r.status !== 429)) { OUT.shift(); scrivi(K_OUT + prog, OUT); segnaLinea(true); }
      else { segnaLinea(r.status !== 429 ? false : inLinea); break; }
      if (OUT.length > 5) await dormi(400);
    }
  } finally { svuota.in = false; testata(); }
}
async function ricevi() {
  if (!P || !IMP.condividi || !CANALE || !navigator.onLine || ricevi.in) return;
  ricevi.in = true;
  const prog = st.prog;
  try {
    const r = await fetch(NTFY + CANALE + "/json?poll=1&since=" + encodeURIComponent(SYNC.ultimo || "all"));
    if (!r.ok) { segnaLinea(false); return; }
    const t = await r.text();
    if (st.prog !== prog) return;
    let cambia = false;

      if (!sc && !fine && now - prev <= N) continue;    // e' il controllo di adesso: c'e' ancora tempo
      out.push({ sessione: s.n, punto: v.punto, operatore: (r && r.operatore) || v.operatore || "", inserito_da: "", n: k, previsto: hhmm(prev), eseguito: "", ritardo_min: "",
        gdop: null, pdop: null, satelliti: null, soglia: Number(IMP.gdop_soglia) || null, esito: sc ? "non verificabile" : "non eseguito", motivo: sc ? r.senza_ctrl.motivo || "" : "", nota: "", _t: prev });
    }
  }));
  return out.sort((a, b) => a.sessione - b.sessione || String(a.punto).localeCompare(String(b.punto)) || a._t - b._t);
}

/* ---------------------------------------------------------------- foto (IndexedDB, restano sul telefono) */
function fotoDb() {
  return fotoDb.p || (fotoDb.p = new Promise((ok, ko) => {
    const r = indexedDB.open("terra_sess_foto", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("foto", { keyPath: "id" });
    r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
  }));
}
async function fotoElenco(filtro) {
  const d = await fotoDb();
  return new Promise((ok) => {
    const out = [], q = d.transaction("foto").objectStore("foto").openCursor();
    q.onsuccess = () => { const c = q.result; if (!c) { ok(out.sort((a, b) => a.ts - b.ts)); return; } if (c.value.prog === st.prog && (!filtro || filtro(c.value))) out.push(c.value); c.continue(); };
    q.onerror = () => ok(out);
  });
}
async function fotoScrivi(f, togli) {
  const d = await fotoDb();
  return new Promise((ok, ko) => { const t = d.transaction("foto", "readwrite"); togli ? t.objectStore("foto").delete(f) : t.objectStore("foto").put(f); t.oncomplete = () => ok(); t.onerror = () => ko(t.error); });
}
async function riduci(file, lato) {
  let img;
  try { img = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch (e) { img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = URL.createObjectURL(file); }); }
  const w = img.width, h = img.height, k = Math.min(1, lato / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.82));
}
async function fotoAggiungi(sn, nomeP, file) {
  const b = await riduci(file, 1600), t = Date.now();
  await fotoScrivi({ id: st.prog + "|" + sn + "|" + nomeP + "|" + t, prog: st.prog, sessione: sn, punto: nomeP, ts: t, data: oggi(), ora: hhmm(t), dati: b });
}
async function mostraFoto(sn, nomeP) {
  const el = $("#foto-l"); if (!el) return;
  let ff = [];
  try { ff = await fotoElenco((f) => f.sessione === sn && f.punto === nomeP); } catch (e) { el.innerHTML = '<span class="tenue">Foto non disponibili su questo telefono.</span>'; return; }
  (mostraFoto.url || []).forEach((u) => URL.revokeObjectURL(u));
  mostraFoto.url = ff.map((f) => URL.createObjectURL(f.dati));
  el.innerHTML = ff.map((f, i) => `<div><img src="${mostraFoto.url[i]}" alt="" onclick="window.open(this.src)"><button data-id="${esc(f.id)}" aria-label="Elimina">&times;</button><span>${esc(f.ora)}</span></div>`).join("");
  el.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => chiedi("Elimino questa foto dal telefono?", "Elimina", async () => { await fotoScrivi(b.dataset.id, true); mostraFoto(sn, nomeP); }, true)));
}
function inBase64(blob) { return new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1] || ""); r.onerror = () => ok(""); r.readAsDataURL(blob); }); }

/* ---------------------------------------------------------------- registro */
function righeRegistro() {
  const out = [];
  P.sessioni.forEach((s) => {
    const fp = finePrevista(s);
    s.vertici.forEach((v) => {
      const r = REG[s.n + "|" + v.punto]; if (!r || (!r.inizio && !r.fine && r.hant == null && !r.note)) return;
      const cc = Object.values(CTRL).filter((c) => c.sessione === s.n && c.punto === v.punto);
      const ini = iniTs(s, r), fin = r.fin_ts || (r.fine ? tsDa(r.data || s.data, r.fine) : null);
      out.push({ sessione: s.n, nome_sessione: s.nome || "", data: r.data || s.data || "", punto: v.punto, ricevitore: v.ric, operatore: r.operatore || v.operatore || "",
        file: v.file, h_antenna: r.hant, tipo_altezza: r.tipoh || "verticale", inizio: r.inizio || "", fine: r.fine || "",
        durata_min: ini && fin ? Math.round((fin - ini) / 60000) : null, fine_sessione_calcolata: fp ? hhmm(fp) : "",
        inizio_previsto: s.inizio, fine_previsto: s.fine, controlli_gdop: cc.length, gdop_max: cc.some((c) => c.gdop != null) ? Math.max(...cc.filter((c) => c.gdop != null).map((c) => c.gdop)) : null, note: r.note || "" });
    });
  });
  return out;
}

    ${cc.map((c) => `<tr><td>${c.sessione}</td><td>${esc(c.punto)}</td><td>${esc(c.previsto)}</td><td>${esc(c.eseguito)}</td><td>${c.gdop != null ? String(c.gdop).replace(".", ",") : ""}</td><td>${c.satelliti != null ? c.satelliti : ""}</td><td class="${classeEsito(c.esito)}">${esc(c.esito)}${c.motivo ? '<div class="tenue">' + esc(c.motivo) + "</div>" : ""}</td></tr>`).join("")}</table></div>`;

function collegaImpostazioni() {
  const num = (id, d) => { const t = $(id).value.replace(",", ".").trim(); const x = Number(t); return t === "" || !isFinite(x) ? d : x; };
  const comuni = () => { IMP.ts = Date.now(); salvaImp(); inviaImp(); disegna(); };
  $("#i-cond").addEventListener("change", (e) => { IMP.condividi = e.target.checked; salvaImp(); if (IMP.condividi) avviaCondivisione(); testata(); disegna(); });
  $("#i-dur").addEventListener("change", () => { IMP.durata = Math.max(1, Math.round(num("#i-dur", IMP.durata))); comuni(); });
  $("#i-gmin").addEventListener("change", () => { IMP.gdop_min = Math.max(0, Math.round(num("#i-gmin", 0))); comuni(); });
  $("#i-gsog").addEventListener("change", () => { IMP.gdop_soglia = Math.max(0, num("#i-gsog", IMP.gdop_soglia)); comuni(); });
  $("#i-suono").addEventListener("change", (e) => { IMP.suono = e.target.checked; salvaImp(); });
  $("#i-schermo").addEventListener("change", (e) => { IMP.schermo = e.target.checked; salvaImp(); schermoAcceso(); });
  $("#i-prova").addEventListener("click", () => { chiediPermessi(); sbloccaAudio(); bip(6, true); vibra([800, 300, 800]); notifica("TERRA Sessioni", "Prova dell'allarme di fine sessione", "prova"); });
  const cp = $("#i-copia");
  if (cp) cp.addEventListener("click", (e) => { e.preventDefault(); try { navigator.clipboard.writeText(CANALE + "-avvisi").then(() => toast("Copiato")); } catch (x) { toast(CANALE + "-avvisi"); } });
}
function csv(colonne, righe) {
  const q = (v) => { v = v == null ? "" : typeof v === "number" ? String(v).replace(".", ",") : String(v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  return colonne.join(";") + "\r\n" + righe.map((x) => colonne.map((k) => q(x[k])).join(";")).join("\r\n") + "\r\n";
}
const COL_REG = ["sessione", "nome_sessione", "data", "punto", "ricevitore", "operatore", "file", "h_antenna", "tipo_altezza", "inizio", "fine", "durata_min", "fine_sessione_calcolata", "inizio_previsto", "fine_previsto", "controlli_gdop", "gdop_max", "note"];
const COL_CTRL = ["sessione", "punto", "operatore", "inserito_da", "n", "previsto", "eseguito", "ritardo_min", "gdop", "pdop", "satelliti", "soglia", "esito", "motivo", "nota"];
async function registroHtml(rr, cc, ff, chi) {
  const n3 = (x) => x == null ? "" : Number(x).toFixed(3).replace(".", ",");
  const n1 = (x) => x == null ? "" : String(x).replace(".", ",");
  let foto = "";
  for (const f of ff) foto += `<figure><img src="data:image/jpeg;base64,${await inBase64(f.dati)}" alt=""><figcaption>Sessione ${f.sessione} · ${esc(f.punto)} · ${esc(f.data || "")} ${esc(f.ora)}</figcaption></figure>`;
  const nF = cc.filter((c) => c.esito === "oltre soglia").length, nN = cc.filter((c) => c.esito === "non eseguito").length, nV = cc.filter((c) => c.esito === "non verificabile").length;
  return `<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Registro ${esc(P.progetto || "")}</title>
<style>body{font:14px/1.4 Arial,sans-serif;color:#1D262B;margin:20px}h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:24px 0 8px;border-bottom:2px solid #2F6B4F;padding-bottom:3px}

.f{color:#D2382F;font-weight:700}.n{color:#8A6400;font-weight:700}figure{display:inline-block;margin:0 10px 12px 0;width:300px;vertical-align:top}figure img{width:100%;border-radius:6px}figcaption{font-size:12px;color:#6B7780}
@media print{figure{width:45%}h2{break-after:avoid}}</style></head><body>

${rr.map((x) => `<tr><td>${x.sessione}</td><td>${esc(x.data)}</td><td><b>${esc(x.punto)}</b></td><td>${x.ricevitore}</td><td>${esc(x.operatore)}</td><td>${esc(x.file)}</td><td>${x.h_antenna != null ? n3(x.h_antenna) : '<span class="f">manca</span>'}</td><td>${esc(x.tipo_altezza)}</td><td>${esc(x.inizio)}</td><td>${esc(x.fine)}</td><td>${x.durata_min != null ? x.durata_min : ""}</td><td>${esc(x.fine_sessione_calcolata)}</td><td>${x.controlli_gdop}</td><td>${n1(x.gdop_max)}</td><td>${esc(x.note)}</td></tr>`).join("")}</table>

window.esporta = async (tipo) => {
  const rr = righeRegistro(), cc = righeControlli();
  if (!rr.length && !cc.length) { toast("Il registro e' vuoto"); return; }
  const chi = io() || "tutti";
  const base = (P.progetto || "rete").replace(/[^\w\-]+/g, "_") + "_registro_" + chi.replace(/[^\w\-]+/g, "_") + "_" + oggi().replace(/\//g, "");
  let ff = [];
  try { ff = await fotoElenco(); } catch (e) {}
  let testo, nome, mime;
  toast("Preparo il registro...");
  const ctrl = cc.map((c) => { const y = Object.assign({}, c); delete y._t; return y; });
  if (tipo === "json") {
    const foto = [];
    for (const f of ff) foto.push({ sessione: f.sessione, punto: f.punto, data: f.data, ora: f.ora, jpeg_base64: await inBase64(f.dati) });
    testo = JSON.stringify({ terra: "registro-campagna", versione: 2, progetto: P.progetto, creato: P.creato, operatore: chi, esportato: oggi() + " " + ora(), app: VERSIONE,
      impostazioni: { durata_min: durata(), gdop_ogni_min: IMP.gdop_min, gdop_soglia: IMP.gdop_soglia }, righe: rr, controlli: ctrl, foto }, null, 1);
    nome = base + ".json"; mime = "application/json";
  } else if (tipo === "csv") {
    testo = "﻿" + csv(COL_REG, rr) + "\r\nCONTROLLI GDOP\r\n" + csv(COL_CTRL, ctrl);
    nome = base + ".csv"; mime = "text/csv";
  } else {
    testo = await registroHtml(rr, ctrl, ff, chi);
    nome = base + ".html"; mime = "text/html";
  }
  const file = new File([testo], nome, { type: mime });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: nome }); return; }
  } catch (e) {
    if (e && e.name === "AbortError") return;
    if (e && e.name === "NotAllowedError") {   // preparazione lunga (foto): il telefono vuole un altro tocco
      chiedi(`Registro pronto: <b>${esc(nome)}</b>`, "Condividi", () => navigator.share({ files: [file], title: nome }).catch(() => {}));
      return;
    }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast("Salvato: " + nome);
};

/* ---------------------------------------------------------------- dialogo */
function chiedi(html, si, fai, pericolo) {
  const d = document.createElement("div"); d.className = "dialogo";
  d.innerHTML = `<div class="box"><div style="margin-bottom:14px">${html}</div><div class="bottoni"><button class="b2" data-x="no">Annulla</button><button class="b ${pericolo ? "rosso" : ""}" data-x="si">${esc(si)}</button></div></div>`;
  d.addEventListener("click", (e) => { const x = e.target.dataset.x; if (x || e.target === d) { d.remove(); if (x === "si") fai(); } });
  document.body.appendChild(d);
}
