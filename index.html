<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14271E">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>TERRA Sessioni</title>
<style>
  :root {
    --fondo: #F3F4F0; --scuro: #14271E; --scuro2: #1F3A2D; --testo: #1D262B; --tenue: #6B7780; --bordo: #D7DBD4;
    --verde: #2F6B4F; --arancio: #E8892B; --rosso: #D2382F; --blu: #1E7BC4; --bianco: #FFFFFF; --giallo: #FBEFC4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--testo);
    font: 16px/1.35 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { background: var(--scuro); color: #EDEFE8; padding: calc(env(safe-area-inset-top) + 10px) 14px 10px; display: flex; align-items: center; gap: 10px; }
  header img { width: 30px; height: 30px; border-radius: 6px; }
  header .tit { flex: 1; min-width: 0; }
  header .tit b { display: block; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .tit span { font-size: 12.5px; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  header button { background: var(--scuro2); color: #EDEFE8; border: 0; border-radius: 8px; padding: 8px 10px; font-size: 14px; }
  main { flex: 1; overflow-y: auto; padding: 12px 12px 90px; -webkit-overflow-scrolling: touch; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bianco); border-top: 1px solid var(--bordo); display: flex;
    padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
  nav button { flex: 1; background: none; border: 0; padding: 9px 4px 10px; font-size: 12.5px; color: var(--tenue); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav button svg { width: 24px; height: 24px; }
  nav button.att { color: var(--verde); font-weight: 600; }
  .scheda { background: var(--bianco); border: 1px solid var(--bordo); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .riga { display: flex; align-items: center; gap: 10px; }
  .tenue { color: var(--tenue); font-size: 13.5px; }
  .grande { font-size: 19px; font-weight: 700; }
  .num { min-width: 40px; height: 40px; border-radius: 10px; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; padding: 0 6px; }
  .stato { font-size: 12px; font-weight: 700; border-radius: 20px; padding: 3px 9px; white-space: nowrap; }
  .st-dafare { background: #EEF0EC; color: var(--tenue); }
  .st-corso { background: var(--giallo); color: #8A6400; }
  .st-fatta { background: #DCEFE3; color: var(--verde); }
  .mio { background: #F7FBF8; border-left: 4px solid var(--verde); }
  .b, .b2 { display: inline-block; text-align: center; text-decoration: none; }
  button.b { border: 0; border-radius: 10px; padding: 12px 14px; font-size: 16px; font-weight: 600; background: var(--verde); color: #fff; }
  .b2 { border: 1px solid var(--bordo); border-radius: 10px; padding: 11px 13px; font-size: 15px; background: var(--bianco); color: var(--testo); }
  button.arancio { background: var(--arancio); }
  button.rosso { background: var(--rosso); }
  button:disabled { opacity: .45; }
  .bottoni { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .bottoni > * { flex: 1 1 auto; }
  label.campo { display: block; font-size: 13px; color: var(--tenue); margin: 10px 0 4px; }
  input[type=text], input[type=number], input[type=time], textarea, select {
    width: 100%; font: inherit; font-size: 16px; padding: 10px; border: 1px solid var(--bordo); border-radius: 9px; background: #fff; color: var(--testo); }
  textarea { min-height: 70px; resize: vertical; }
  .seg { display: flex; border: 1px solid var(--bordo); border-radius: 9px; overflow: hidden; }
  .seg button { flex: 1; border: 0; background: #fff; padding: 10px; font-size: 15px; }
  .seg button.att { background: var(--verde); color: #fff; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  td, th { padding: 7px 5px; border-bottom: 1px solid #ECEEEA; text-align: left; vertical-align: top; }
  th { font-size: 12px; color: var(--tenue); font-weight: 600; }
  .chip { display: inline-block; background: #EEF0EC; border-radius: 20px; padding: 3px 10px; font-size: 13px; margin: 2px 4px 2px 0; }
  .filtri { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 6px; }
  .filtri button { flex: 0 0 auto; border: 1px solid var(--bordo); background: #fff; border-radius: 20px; padding: 7px 13px; font-size: 14px; }
  .filtri button.att { background: var(--scuro2); color: #fff; border-color: var(--scuro2); }
  #schema { width: 100%; height: calc(100vh - 230px); min-height: 320px; background: #fff; border: 1px solid var(--bordo); border-radius: 12px; touch-action: none; display: block; }
  .bussola { display: flex; align-items: center; gap: 16px; }
  .bussola svg { width: 110px; height: 110px; flex: 0 0 auto; }
  .avviso { background: var(--giallo); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 10px; }
  .vuoto { text-align: center; color: var(--tenue); padding: 40px 20px; }
  .vuoto img { width: 84px; opacity: .9; margin-bottom: 10px; }
  .ora { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px; }
  #toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--scuro); color: #fff;
    padding: 10px 16px; border-radius: 10px; font-size: 14.5px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 9; max-width: 90%; text-align: center; }
  #toast.vis { opacity: .95; }
  .dialogo { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 8; }
  .dialogo .box { background: #fff; width: 100%; max-width: 560px; border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
  a.link { color: var(--blu); }
  .fineprev { background: #EAF3FB; border: 1px solid #C9DFF2; border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
  .fineprev.scaduta { background: #FDE7E5; border-color: #F2C3BF; }
  .cd { font-variant-numeric: tabular-nums; font-weight: 700; }
  .foto { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .foto div { position: relative; width: 96px; height: 96px; border-radius: 9px; overflow: hidden; background: #EEF0EC; }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .foto button { position: absolute; top: 3px; right: 3px; width: 26px; height: 26px; border-radius: 13px; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 15px; line-height: 26px; padding: 0; }
  .foto span { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.5); color: #fff; font-size: 11px; text-align: center; padding: 1px 0; }
  .fuori { color: var(--rosso); font-weight: 700; }
  .allarme .box { border-top: 6px solid var(--rosso); }
  .allarme .grande { font-size: 24px; }
  .interr { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid #ECEEEA; }
  .interr input[type=checkbox] { width: 24px; height: 24px; flex: 0 0 auto; }
  .interr input[type=number] { width: 90px; flex: 0 0 auto; text-align: right; }
</style>
</head>
<body>
<header>
  <img src="icona-192.png" alt="">
  <div class="tit"><b id="h-tit">TERRA Sessioni</b><span id="h-sub">Sessioni GNSS in campagna</span></div>
  <button id="h-oper" hidden></button>
</header>
<main id="main"></main>
<nav id="nav" hidden>
  <button data-v="sessioni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Sessioni</button>
  <button data-v="schema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="17" r="2"/><circle cx="18" cy="17" r="2"/><circle cx="12" cy="6" r="2"/><path d="M7.5 15.5 11 7.8M13 7.8l3.5 7.7M8 17h8"/></svg>Schema</button>
  <button data-v="registro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h7"/></svg>Registro</button>
  <button data-v="progetti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h7l2 2h9v10H3z"/></svg>Progetti</button>
</nav>
<div id="toast"></div>
<input type="file" id="file" accept=".json,application/json,text/plain,application/octet-stream" hidden>

<script>
"use strict";
/* ======================================================================
   TERRA Sessioni - app di campagna per le sessioni GNSS di Progetto reti GPS.
   Legge il file .json esportato da TERRA ("Per l'app di campagna..."), funziona senza internet,
   salva sul telefono quello che si scrive (altezza d'antenna, orari veri, note) ed esporta il
   registro della campagna in JSON e CSV. Misure in metri.
   ====================================================================== */
const VERSIONE = "2.0";
const K_PROG = "terra_sess_progetti", K_REG = "terra_sess_reg_", K_STATO = "terra_sess_stato";
const K_CTRL = "terra_sess_ctrl_", K_IMP = "terra_sess_imp_", K_OUT = "terra_sess_out_", K_SYNC = "terra_sess_sync_", K_SUON = "terra_sess_suon_", K_DEV = "terra_sess_dev";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function leggi(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function scrivi(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { toast("Non riesco a salvare sul telefono (memoria piena?)"); return false; } }
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("vis"); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("vis"), 2600); }
function ora() { const d = new Date(); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
function oggi() { const d = new Date(); return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear(); }
function metri(m) { return m >= 10000 ? (m / 1000).toFixed(1).replace(".", ",") + " km (" + Math.round(m).toLocaleString("it-IT") + " m)" : Math.round(m).toLocaleString("it-IT") + " m"; }

/* ---------------------------------------------------------------- stato */
let progetti = leggi(K_PROG, []);
let st = Object.assign({ prog: null, vista: "sessioni", oper: "", sess: null, punto: null }, leggi(K_STATO, {}));
let P = null, REG = {};          // progetto aperto e registro (per "sessione|punto")
let pos = null, guarda = null, rotta = null;  // posizione GPS e direzione del telefono
let CTRL = {}, IMP = {}, OUT = [], SYNC = { ultimo: "", inviato: 0 }, SUONATI = {}, CANALE = "", inLinea = null;  // controlli, impostazioni, condivisione
let DEV = leggi(K_DEV, ""); if (!DEV) { DEV = Math.random().toString(36).slice(2, 10); scrivi(K_DEV, DEV); }
function impBase() { return { condividi: true, durata: P && P.durata ? Math.round(P.durata) : 30, gdop_min: 0, gdop_soglia: 6, suono: true, schermo: true, ts: 0 }; }
function durata() { return Math.max(1, Number(IMP.durata) || 30); }
/* impronta del file delle sessioni: stesso file = stesso canale, senza il file il canale non si indovina */
function impronta(t) {
  let out = "";
  for (let k = 0; k < 4; k++) {
    let h1 = 0xdeadbeef ^ k, h2 = 0x41c6ce57 ^ (k * 7919);
    for (let i = 0; i < t.length; i++) { const c = t.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    out += (h1 >>> 0).toString(16).padStart(8, "0");
  }
  return out;
}
/* "19/11/2026" + "16:05" -> millisecondi */
function tsDa(data, hhmm) {
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(data || oggi()) || /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(oggi());
  const t = /^(\d{1,2}):(\d{2})/.exec(hhmm || ""); if (!t) return null;
  return new Date(+m[3], +m[2] - 1, +m[1], +t[1], +t[2]).getTime();
}
function hhmm(ms) { const d = new Date(ms); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }

function salvaStato() { scrivi(K_STATO, { prog: st.prog, vista: st.vista, oper: st.oper, sess: st.sess, punto: st.punto }); }
function apriProgetto(id) {
  const x = progetti.find((p) => p.id === id);
  P = x ? x.dati : null; st.prog = x ? id : null;
  REG = P ? leggi(K_REG + id, {}) : {};
  CTRL = P ? leggi(K_CTRL + id, {}) : {};
  IMP = P ? Object.assign(impBase(), leggi(K_IMP + id, {})) : {};
  OUT = P ? leggi(K_OUT + id, []) : [];
  SYNC = P ? Object.assign({ ultimo: "", inviato: 0 }, leggi(K_SYNC + id, {})) : { ultimo: "", inviato: 0 };
  SUONATI = P ? leggi(K_SUON + id, {}) : {};
  CANALE = P ? "terra-" + impronta(JSON.stringify(P)) : "";
  if (P && st.oper && st.oper !== "*" && !(P.operatori || []).includes(st.oper)) st.oper = "";
  if (P) avviaCondivisione();
}
function salvaReg() { if (st.prog) scrivi(K_REG + st.prog, REG); }
function salvaCtrl() { if (st.prog) scrivi(K_CTRL + st.prog, CTRL); }
function salvaImp() { if (st.prog) scrivi(K_IMP + st.prog, IMP); }
function reg(s, p) { const k = s + "|" + p; return REG[k] || (REG[k] = {}); }
function punto(nome) { return (P.punti || []).find((p) => p.nome === nome); }
function sessione(n) { return (P.sessioni || []).find((s) => s.n === n); }
function nomeSess(s) { return "Sessione " + s.n + (s.nome ? " - " + s.nome : ""); }
function miei(s) { return st.oper && st.oper !== "*" ? s.vertici.filter((v) => v.operatore === st.oper) : s.vertici; }
function statoSess(s) {
  const vv = miei(s); if (!vv.length) return "dafare";
  const r = vv.map((v) => REG[s.n + "|" + v.punto] || {});
  if (r.every((x) => x.fine)) return "fatta";
  if (r.some((x) => x.inizio)) return "corso";
  return "dafare";
}
const NOMI_STATO = { dafare: "da fare", corso: "in corso", fatta: "fatta" };

/* ---------------------------------------------------------------- file */
function importaTesto(testo, nomeFile) {
  let d;
  try { d = JSON.parse(testo); } catch (err) { toast("Il file non e' leggibile"); return; }
  if (!d || d.terra !== "sessioni-campagna" || !Array.isArray(d.sessioni)) { toast("Non e' un file di sessioni di TERRA (Progetto reti > Per l'app di campagna)"); return; }
  const id = (d.progetto || "Rete") + " | " + (d.creato || "");
  const vecchio = progetti.find((p) => p.id === id);
  if (vecchio) vecchio.dati = d; else progetti.unshift({ id, nome: d.progetto || nomeFile || "Rete", creato: d.creato || "", caricato: oggi() + " " + ora(), dati: d });
  if (!scrivi(K_PROG, progetti)) return;
  apriProgetto(id); st.sess = null; st.vista = (d.operatori || []).length && !st.oper ? "operatore" : "sessioni";
  salvaStato(); disegna();
  toast((vecchio ? "Aggiornato: " : "Caricato: ") + d.sessioni.length + " sessioni");
}
$("#file").addEventListener("change", (e) => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  const r = new FileReader();
  r.onload = () => importaTesto(r.result, f.name);
  r.readAsText(f, "utf-8");
});
/* file condiviso da WhatsApp, email ecc. (Android: Condividi > TERRA Sessioni): lo mette da parte sw.js */
async function prendiCondiviso() {
  if (!/[?&]condiviso=/.test(location.search) || !("caches" in window)) return;
  history.replaceState(null, "", location.pathname);
  try {
    const c = await caches.open("terra-condiviso");
    const r = await c.match("condiviso");
    if (!r) { toast("Nessun file ricevuto"); return; }
    const nome = decodeURIComponent(r.headers.get("X-Nome") || "");
    const testo = await r.text();
    await c.delete("condiviso");
    importaTesto(testo, nome);
  } catch (e) { toast("Non riesco a leggere il file condiviso"); }
}

/* ---------------------------------------------------------------- viste */
function vai(v, extra) { Object.assign(st, extra || {}); st.vista = v; salvaStato(); disegna(); $("#main").scrollTop = 0; }
document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => vai(b.dataset.v, { sess: b.dataset.v === "sessioni" ? null : st.sess })));
$("#h-oper").addEventListener("click", () => vai("operatore"));

function disegna() {
  const m = $("#main");
  if (!P && st.vista !== "progetti") st.vista = "progetti";
  $("#nav").hidden = !P;
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("att", b.dataset.v === st.vista || (st.vista === "dettaglio" && b.dataset.v === "sessioni")));
  $("#h-tit").textContent = P ? P.progetto || "Rete GNSS" : "TERRA Sessioni";
  testata();
  const ho = $("#h-oper"); ho.hidden = !P || !(P.operatori || []).length; ho.textContent = st.oper && st.oper !== "*" ? st.oper : "Tutti";
  if (st.vista !== "schema" && st.vista !== "dettaglio") fermaGps();
  ({ progetti: vProgetti, operatore: vOperatore, sessioni: vSessioni, dettaglio: vDettaglio, schema: vSchema, registro: vRegistro }[st.vista] || vSessioni)(m);
}

function vProgetti(m) {
  let h = "";
  if (!progetti.length) {
    h += `<div class="vuoto"><img src="icona-192.png" alt=""><div class="grande" style="color:var(--testo)">TERRA Sessioni</div>
      <p>Apri il file delle sessioni preparato in TERRA:<br><b>Progetto reti GPS &gt; Esporta &gt; Per l'app di campagna...</b><br>
      Mandalo sul telefono (WhatsApp, email, cloud) e aprilo qui. Poi l'app funziona anche senza internet.</p></div>`;
  }
  h += `<button class="b" style="width:100%" onclick="document.getElementById('file').click()">Apri file delle sessioni</button>`;
  if (progetti.length) h += `<p class="tenue" style="margin:16px 4px 6px">Campagne sul telefono</p>`;
  progetti.forEach((p, i) => {
    const d = p.dati, r = leggi(K_REG + p.id, {});
    const fatte = Object.values(r).filter((x) => x && x.fine).length;
    h += `<div class="scheda ${p.id === st.prog ? "mio" : ""}"><div class="riga"><div style="flex:1;min-width:0">
      <div style="font-weight:700">${esc(p.nome)}</div>
      <div class="tenue">${d.sessioni.length} sessioni · ${(d.punti || []).length} punti · esportato da TERRA ${esc(p.creato)}</div>
      <div class="tenue">${fatte} vertici registrati</div></div></div>
      <div class="bottoni"><button class="b" onclick="usaProg(${i})">${p.id === st.prog ? "Aperta" : "Apri"}</button>
      <button class="b2" onclick="togliProg(${i})">Elimina</button></div></div>`;
  });
  h += `<p class="tenue" style="text-align:center;margin-top:24px">TERRA Sessioni ${VERSIONE} · i dati restano su questo telefono</p>`;
  m.innerHTML = h;
}
window.usaProg = (i) => { apriProgetto(progetti[i].id); vai((P.operatori || []).length && !st.oper ? "operatore" : "sessioni", { sess: null }); };
window.togliProg = (i) => {
  chiedi(`Elimino la campagna <b>${esc(progetti[i].nome)}</b> e il suo registro da questo telefono?<br><span class="tenue">Esporta prima il registro se ti serve.</span>`, "Elimina", () => {
    const p = progetti.splice(i, 1)[0];
    try { localStorage.removeItem(K_REG + p.id); } catch (e) {}
    scrivi(K_PROG, progetti);
    if (st.prog === p.id) { P = null; st.prog = null; }
    salvaStato(); disegna();
  }, true);
};

function vOperatore(m) {
  let h = `<p class="grande" style="margin:6px 4px 12px">Chi sei?</p><p class="tenue" style="margin:0 4px 12px">L'app mette in evidenza i tuoi vertici e le tue sessioni.</p>`;
  (P.operatori || []).forEach((o, i) => {
    const n = P.sessioni.filter((s) => s.vertici.some((v) => v.operatore === o)).length;
    h += `<button class="b2" style="width:100%;text-align:left;margin-bottom:8px;${st.oper === o ? "border-color:var(--verde);border-width:2px" : ""}" onclick="scegliOper(${i})">
      <b>${esc(o)}</b> <span class="tenue">· ricevitore ${i + 1} · ${n} sessioni</span></button>`;
  });

let vb = null;

async function fotoScrivi(f, togli) {
  const d = await fotoDb();
  return new Promise((ok, ko) => { const t = d.transaction("foto", "readwrite"); togli ? t.objectStore("foto").delete(f) : t.objectStore("foto").put(f); t.oncomplete = () => ok(); t.onerror = () => ko(t.error); });
}
async function riduci(file, lato) {
  let img;
  try { img = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch (e) { img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = URL.createObjectURL(file); }); }
  const w = img.width, h = img.height, k = Math.min(1, lato / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.82));
}
async function fotoAggiungi(sn, nomeP, file) {
  const b = await riduci(file, 1600), t = Date.now();
  await fotoScrivi({ id: st.prog + "|" + sn + "|" + nomeP + "|" + t, prog: st.prog, sessione: sn, punto: nomeP, ts: t, data: oggi(), ora: hhmm(t), dati: b });
}
async function mostraFoto(sn, nomeP) {
  const el = $("#foto-l"); if (!el) return;
  let ff = [];
  try { ff = await fotoElenco((f) => f.sessione === sn && f.punto === nomeP); } catch (e) { el.innerHTML = '<span class="tenue">Foto non disponibili su questo telefono.</span>'; return; }
  (mostraFoto.url || []).forEach((u) => URL.revokeObjectURL(u));
  mostraFoto.url = ff.map((f) => URL.createObjectURL(f.dati));
  el.innerHTML = ff.map((f, i) => `<div><img src="${mostraFoto.url[i]}" alt="" onclick="window.open(this.src)"><button data-id="${esc(f.id)}" aria-label="Elimina">&times;</button><span>${esc(f.ora)}</span></div>`).join("");
  el.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => chiedi("Elimino questa foto dal telefono?", "Elimina", async () => { await fotoScrivi(b.dataset.id, true); mostraFoto(sn, nomeP); }, true)));
}
function inBase64(blob) { return new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1] || ""); r.onerror = () => ok(""); r.readAsDataURL(blob); }); }

/* ---------------------------------------------------------------- registro */
function righeRegistro() {
  const out = [];
  P.sessioni.forEach((s) => {
    const fp = finePrevista(s);
    s.vertici.forEach((v) => {
      const r = REG[s.n + "|" + v.punto]; if (!r || (!r.inizio && !r.fine && r.hant == null && !r.note)) return;
      const cc = Object.values(CTRL).filter((c) => c.sessione === s.n && c.punto === v.punto);
      const ini = iniTs(s, r), fin = r.fin_ts || (r.fine ? tsDa(r.data || s.data, r.fine) : null);
      out.push({ sessione: s.n, nome_sessione: s.nome || "", data: r.data || s.data || "", punto: v.punto, ricevitore: v.ric, operatore: r.operatore || v.operatore || "",
        file: v.file, h_antenna: r.hant, tipo_altezza: r.tipoh || "verticale", inizio: r.inizio || "", fine: r.fine || "",
        durata_min: ini && fin ? Math.round((fin - ini) / 60000) : null, fine_sessione_calcolata: fp ? hhmm(fp) : "",
        inizio_previsto: s.inizio, fine_previsto: s.fine, controlli_gdop: cc.length, gdop_max: cc.length ? Math.max(...cc.map((c) => c.gdop)) : null, note: r.note || "" });
    });
  });
  return out;
}
function vRegistro(m) {
  const rr = righeRegistro(), cc = righeControlli();
  const nOk = cc.filter((c) => c.esito === "ok").length, nF = cc.filter((c) => c.esito === "oltre soglia").length, nN = cc.filter((c) => c.esito === "non eseguito").length;
  let h = `<div class="scheda"><div class="grande">Registro della campagna</div><div class="tenue">${rr.length} vertici registrati su ${P.sessioni.reduce((a, s) => a + s.vertici.length, 0)} · ${cc.length} controlli GDOP</div>
    <div class="bottoni"><button class="b" onclick="esporta('html')">Registro completo (con foto)</button></div>
    <div class="bottoni"><button class="b2" onclick="esporta('json')">JSON (TERRA)</button><button class="b2" onclick="esporta('csv')">CSV per Excel</button></div>
    <div class="tenue" style="margin-top:8px">Il registro completo si apre su qualsiasi telefono o PC: tabella dei vertici, tabella dei controlli e foto.${IMP.condividi ? " Contiene i dati di tutti i telefoni arrivati dal canale; le foto sono solo quelle di questo telefono." : ""}</div></div>`;
  h += vImpostazioni();
  if (!rr.length) h += `<div class="vuoto">Ancora nessun vertice registrato.</div>`;
  else h += `<div class="scheda" style="overflow-x:auto"><b>Vertici</b><table><tr><th>S.</th><th>Vertice</th><th>H ant. (m)</th><th>Inizio</th><th>Fine</th><th>Note</th></tr>
    ${rr.map((x) => `<tr onclick="vai('dettaglio',{sess:${x.sessione},punto:'${esc(x.punto)}'})"><td>${x.sessione}</td><td><b>${esc(x.punto)}</b><div class="tenue">${esc(x.operatore)}</div></td>
      <td>${x.h_antenna != null ? x.h_antenna.toFixed(3).replace(".", ",") : '<span style="color:var(--rosso)">manca</span>'}</td><td>${esc(x.inizio)}</td><td>${esc(x.fine)}</td><td class="tenue">${esc(x.note)}</td></tr>`).join("")}</table></div>`;
  if (cc.length) h += `<div class="scheda" style="overflow-x:auto"><b>Controlli GDOP</b> <span class="tenue">· ${nOk} ok · ${nF} oltre soglia · ${nN} non eseguiti</span>
    <table><tr><th>S.</th><th>Vertice</th><th>Prev.</th><th>Fatto</th><th>GDOP</th><th>Sat.</th><th>Esito</th></tr>
    ${cc.map((c) => `<tr><td>${c.sessione}</td><td>${esc(c.punto)}</td><td>${esc(c.previsto)}</td><td>${esc(c.eseguito)}</td><td>${c.gdop != null ? String(c.gdop).replace(".", ",") : ""}</td><td>${c.satelliti != null ? c.satelliti : ""}</td><td class="${c.esito === "ok" ? "" : "fuori"}">${esc(c.esito)}</td></tr>`).join("")}</table></div>`;
  m.innerHTML = h;
  collegaImpostazioni();
}
function vImpostazioni() {
  const n = (x) => String(x == null ? "" : x).replace(".", ",");
  return `<div class="scheda"><b>Impostazioni della campagna</b>
    <div class="interr"><div>Stato condiviso tra i telefoni<div class="tenue">${IMP.condividi ? (inLinea ? "in linea" : "non in linea: i dati partono quando torna internet") + (OUT.length ? " · " + OUT.length + " da inviare" : "") : "spento: i dati restano solo qui"}</div></div><input type="checkbox" id="i-cond" ${IMP.condividi ? "checked" : ""}></div>
    <div class="interr"><div>Durata della sessione (min)<div class="tenue">fine = ultimo ricevitore partito + durata</div></div><input type="number" inputmode="numeric" id="i-dur" value="${n(IMP.durata)}"></div>
    <div class="interr"><div>Controllo GDOP ogni (min)<div class="tenue">0 = nessun controllo a tempo</div></div><input type="number" inputmode="numeric" id="i-gmin" value="${n(IMP.gdop_min)}"></div>
    <div class="interr"><div>Soglia GDOP<div class="tenue">oltre: avviso e "oltre soglia" nel registro</div></div><input type="number" inputmode="decimal" step="0.1" id="i-gsog" value="${n(IMP.gdop_soglia)}"></div>
    <div class="interr"><div>Suono degli allarmi</div><input type="checkbox" id="i-suono" ${IMP.suono ? "checked" : ""}></div>
    <div class="interr"><div>Schermo acceso durante le sessioni<div class="tenue">a schermo spento l'app non puo' suonare</div></div><input type="checkbox" id="i-schermo" ${IMP.schermo ? "checked" : ""}></div>
    <div class="bottoni"><button class="b2" id="i-prova">Prova allarme</button></div>
    <div class="tenue" style="margin-top:8px">Durata e controlli GDOP valgono per tutti: cambiati qui, arrivano agli altri telefoni.${IMP.condividi ? `<br>Allarme anche a telefono bloccato: installa l'app <b>ntfy</b> e iscriviti all'argomento <b style="word-break:break-all">${esc(CANALE)}-avvisi</b> <a class="link" href="#" id="i-copia">copia</a>` : ""}</div></div>`;
}
function collegaImpostazioni() {
  const num = (id, d) => { const t = $(id).value.replace(",", ".").trim(); const x = Number(t); return t === "" || !isFinite(x) ? d : x; };
  const comuni = () => { IMP.ts = Date.now(); salvaImp(); inviaImp(); disegna(); };
  $("#i-cond").addEventListener("change", (e) => { IMP.condividi = e.target.checked; salvaImp(); if (IMP.condividi) avviaCondivisione(); testata(); disegna(); });
  $("#i-dur").addEventListener("change", () => { IMP.durata = Math.max(1, Math.round(num("#i-dur", IMP.durata))); comuni(); });
  $("#i-gmin").addEventListener("change", () => { IMP.gdop_min = Math.max(0, Math.round(num("#i-gmin", 0))); comuni(); });
  $("#i-gsog").addEventListener("change", () => { IMP.gdop_soglia = Math.max(0, num("#i-gsog", IMP.gdop_soglia)); comuni(); });
  $("#i-suono").addEventListener("change", (e) => { IMP.suono = e.target.checked; salvaImp(); });
  $("#i-schermo").addEventListener("change", (e) => { IMP.schermo = e.target.checked; salvaImp(); schermoAcceso(); });
  $("#i-prova").addEventListener("click", () => { chiediPermessi(); sbloccaAudio(); bip(6, true); vibra([800, 300, 800]); notifica("TERRA Sessioni", "Prova dell'allarme di fine sessione", "prova"); });
  const cp = $("#i-copia");
  if (cp) cp.addEventListener("click", (e) => { e.preventDefault(); try { navigator.clipboard.writeText(CANALE + "-avvisi").then(() => toast("Copiato")); } catch (x) { toast(CANALE + "-avvisi"); } });
}
function csv(colonne, righe) {
  const q = (v) => { v = v == null ? "" : typeof v === "number" ? String(v).replace(".", ",") : String(v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  return colonne.join(";") + "\r\n" + righe.map((x) => colonne.map((k) => q(x[k])).join(";")).join("\r\n") + "\r\n";
}
const COL_REG = ["sessione", "nome_sessione", "data", "punto", "ricevitore", "operatore", "file", "h_antenna", "tipo_altezza", "inizio", "fine", "durata_min", "fine_sessione_calcolata", "inizio_previsto", "fine_previsto", "controlli_gdop", "gdop_max", "note"];
const COL_CTRL = ["sessione", "punto", "operatore", "n", "previsto", "eseguito", "ritardo_min", "gdop", "pdop", "satelliti", "soglia", "esito", "nota"];
async function registroHtml(rr, cc, ff, chi) {
  const n3 = (x) => x == null ? "" : Number(x).toFixed(3).replace(".", ",");
  const n1 = (x) => x == null ? "" : String(x).replace(".", ",");
  let foto = "";
  for (const f of ff) foto += `<figure><img src="data:image/jpeg;base64,${await inBase64(f.dati)}" alt=""><figcaption>Sessione ${f.sessione} · ${esc(f.punto)} · ${esc(f.data || "")} ${esc(f.ora)}</figcaption></figure>`;
  const nF = cc.filter((c) => c.esito === "oltre soglia").length, nN = cc.filter((c) => c.esito === "non eseguito").length;
  return `<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Registro ${esc(P.progetto || "")}</title>
<style>body{font:14px/1.4 Arial,sans-serif;color:#1D262B;margin:20px}h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:24px 0 8px;border-bottom:2px solid #2F6B4F;padding-bottom:3px}
.t{color:#6B7780}table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{border:1px solid #D7DBD4;padding:4px 6px;text-align:left;vertical-align:top}th{background:#EEF2EC}
.f{color:#D2382F;font-weight:700}.n{color:#8A6400;font-weight:700}figure{display:inline-block;margin:0 10px 12px 0;width:300px;vertical-align:top}figure img{width:100%;border-radius:6px}figcaption{font-size:12px;color:#6B7780}
@media print{figure{width:45%}h2{break-after:avoid}}</style></head><body>
<h1>Registro della campagna GNSS - ${esc(P.progetto || "")}</h1>
<div class="t">Sistema ${esc(P.sistema || "-")} · sessioni da TERRA del ${esc(P.creato || "")} · registro di ${esc(chi)} · esportato ${oggi()} ${ora()} · TERRA Sessioni ${VERSIONE}</div>
<div class="t">Durata sessione ${durata()} min · controllo GDOP ${IMP.gdop_min > 0 ? "ogni " + IMP.gdop_min + " min, soglia " + n1(IMP.gdop_soglia) : "non a tempo"}</div>
<h2>Vertici (${rr.length})</h2>
<table><tr><th>Sess.</th><th>Data</th><th>Vertice</th><th>Ric.</th><th>Operatore</th><th>File</th><th>H ant. (m)</th><th>Tipo</th><th>Inizio</th><th>Fine</th><th>Durata (min)</th><th>Fine calcolata</th><th>Controlli</th><th>GDOP max</th><th>Note</th></tr>
${rr.map((x) => `<tr><td>${x.sessione}</td><td>${esc(x.data)}</td><td><b>${esc(x.punto)}</b></td><td>${x.ricevitore}</td><td>${esc(x.operatore)}</td><td>${esc(x.file)}</td><td>${x.h_antenna != null ? n3(x.h_antenna) : '<span class="f">manca</span>'}</td><td>${esc(x.tipo_altezza)}</td><td>${esc(x.inizio)}</td><td>${esc(x.fine)}</td><td>${x.durata_min != null ? x.durata_min : ""}</td><td>${esc(x.fine_sessione_calcolata)}</td><td>${x.controlli_gdop}</td><td>${n1(x.gdop_max)}</td><td>${esc(x.note)}</td></tr>`).join("")}</table>
<h2>Controlli (${cc.length}${nF ? ", " + nF + " oltre soglia" : ""}${nN ? ", " + nN + " non eseguiti" : ""})</h2>
${cc.length ? `<table><tr><th>Sess.</th><th>Vertice</th><th>Operatore</th><th>N.</th><th>Previsto</th><th>Eseguito</th><th>Ritardo (min)</th><th>GDOP</th><th>PDOP</th><th>Satelliti</th><th>Soglia</th><th>Esito</th><th>Note</th></tr>
${cc.map((c) => `<tr><td>${c.sessione}</td><td>${esc(c.punto)}</td><td>${esc(c.operatore)}</td><td>${esc(c.n)}</td><td>${esc(c.previsto)}</td><td>${esc(c.eseguito)}</td><td>${c.ritardo_min}</td><td>${n1(c.gdop)}</td><td>${n1(c.pdop)}</td><td>${c.satelliti != null ? c.satelliti : ""}</td><td>${n1(c.soglia)}</td><td class="${c.esito === "oltre soglia" ? "f" : c.esito === "non eseguito" ? "n" : ""}">${esc(c.esito)}</td><td>${esc(c.nota)}</td></tr>`).join("")}</table>` : '<p class="t">Nessun controllo.</p>'}
<h2>Foto (${ff.length})</h2>${foto || '<p class="t">Nessuna foto su questo telefono.</p>'}
</body></html>`;
}
window.esporta = async (tipo) => {
  const rr = righeRegistro(), cc = righeControlli();
  if (!rr.length && !cc.length) { toast("Il registro e' vuoto"); return; }
  const chi = st.oper && st.oper !== "*" ? st.oper : "tutti";
  const base = (P.progetto || "rete").replace(/[^\w\-]+/g, "_") + "_registro_" + chi.replace(/[^\w\-]+/g, "_") + "_" + oggi().replace(/\//g, "");
  let ff = [];
  try { ff = await fotoElenco(); } catch (e) {}
  let testo, nome, mime;
  toast("Preparo il registro...");
  const ctrl = cc.map((c) => { const y = Object.assign({}, c); delete y._t; return y; });
  if (tipo === "json") {
    const foto = [];
    for (const f of ff) foto.push({ sessione: f.sessione, punto: f.punto, data: f.data, ora: f.ora, jpeg_base64: await inBase64(f.dati) });
    testo = JSON.stringify({ terra: "registro-campagna", versione: 2, progetto: P.progetto, creato: P.creato, operatore: chi, esportato: oggi() + " " + ora(), app: VERSIONE,
      impostazioni: { durata_min: durata(), gdop_ogni_min: IMP.gdop_min, gdop_soglia: IMP.gdop_soglia }, righe: rr, controlli: ctrl, foto }, null, 1);
    nome = base + ".json"; mime = "application/json";
  } else if (tipo === "csv") {
    testo = "﻿" + csv(COL_REG, rr) + "\r\nCONTROLLI GDOP\r\n" + csv(COL_CTRL, ctrl);
    nome = base + ".csv"; mime = "text/csv";
  } else {
    testo = await registroHtml(rr, ctrl, ff, chi);
    nome = base + ".html"; mime = "text/html";
  }
  const file = new File([testo], nome, { type: mime });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: nome }); return; }
  } catch (e) {
    if (e && e.name === "AbortError") return;
    if (e && e.name === "NotAllowedError") {   // preparazione lunga (foto): il telefono vuole un altro tocco
      chiedi(`Registro pronto: <b>${esc(nome)}</b>`, "Condividi", () => navigator.share({ files: [file], title: nome }).catch(() => {}));
      return;
    }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast("Salvato: " + nome);
};

/* ---------------------------------------------------------------- dialogo */
function chiedi(html, si, fai, pericolo) {
  const d = document.createElement("div"); d.className = "dialogo";
  d.innerHTML = `<div class="box"><div style="margin-bottom:14px">${html}</div><div class="bottoni"><button class="b2" data-x="no">Annulla</button><button class="b ${pericolo ? "rosso" : ""}" data-x="si">${esc(si)}</button></div></div>`;
  d.addEventListener("click", (e) => { const x = e.target.dataset.x; if (x || e.target === d) { d.remove(); if (x === "si") fai(); } });
  document.body.appendChild(d);
}

/* ---------------------------------------------------------------- avvio */
if (st.prog) apriProgetto(st.prog);
disegna();
prendiCondiviso();
window.addEventListener("resize", () => { if (st.vista === "schema") { vb = null; schemaDisegna(); } });
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
